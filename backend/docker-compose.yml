version: "3.8"

services:
  api:
    build: .
    container_name: careeros_backend
    ports:
      - "8000:8000"
    environment:
      # Use an actual managed instances in production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/careeros}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15
    container_name: careeros_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careeros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careeros_redis
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: careeros_celery
    command: "watchmedo auto-restart --directory=./app --pattern=*.py --recursive -- celery -A app.core.celery_app worker -l info"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/careeros}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  load_balancer:
    image: nginx:latest
    container_name: careeros_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api

volumes:
  postgres_data:
