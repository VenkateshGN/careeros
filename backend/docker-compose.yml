version: "3.8"

services:
  api:
    build: .
    container_name: careeros_backend
    ports:
      - "8000:8000"
    environment:
      # Use an actual managed instances in production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/careeros}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: careeros_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careeros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
